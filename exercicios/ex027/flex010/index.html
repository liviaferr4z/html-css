<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            flex-flow: row nowrap;
            display: flex;
        }

        div.item {
            background-color: #ffdafa;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }

        div#i1 {
            flex-grow: 1;
            flex-shrink: 0;
        }

        div#i2 {
            flex-grow: 0;
            flex-shrink: 2;
            /* pode utilizar o flex: 0 2 150px no item */
            /* flex-grow + flex-shrink + flex-basis */
        }

        div#i3 {
            flex-grow: 2;
            flex-shrink: 1;
        }

        /* flex: initial é a mesma coisa de flex: 0 1 auto */
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
    </div>
    
</body>
</html>
