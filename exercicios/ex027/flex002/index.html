<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            flex-direction: row;
            display: flex;
            flex-direction: row;
            /* flex-direction: row usa o main-axis da esquerda para direita e cross-axis de cima para baixo.
            row-reverse: usa o main-axis da direita para esquerda.
            column: main-axis de cima para baixo, cross-axis esquerda p/ direita.
            column-reverse: o oposto do column. */
        }

        div.item {
            background-color: #ffdafa;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
    
</body>
</html>
