<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
     <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            height: 300px;
            flex-flow: row nowrap;
            justify-content: space-evenly;
            align-items: flex-end;
        }

        div.item {
            background-color: #ffdafa;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de A</div>
        <div class="item">Exemplo de B</div>
        <div class="item">Exemplo de C</div>
        <div class="item">Exemplo de D</div>
        <div class="item">Exemplo de E</div>
    </div>
</body>
</html>
