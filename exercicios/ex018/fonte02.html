<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Love' ;
            src: url(Singlove.otf) format('opentype');
            font-weight: normal;
            font-style: normal;
            /* Tipos de format ()
               - opentype (otf)
               - truetype (ttf)
               - embedded-opentype
               - truetype-aat 
               - svg
               */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;            
        }

        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Provident consequatur ullam temporibus est possimus aspernatur animi, quod voluptates et. Perspiciatis, aspernatur. Temporibus adipisci atque expedita alias accusantium pariatur, magni dolor.</p>
</body>
</html>
